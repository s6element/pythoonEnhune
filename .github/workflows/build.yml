name: build
on:
  workflow_dispatch:
    inputs:
      full:
        description: "С питоном (иначе диагностический .mtp)"
        type: boolean
        default: false
      toolchain:
        description: "Репо с тулчейном MargyT"
        default: gigbh/MazyT
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Сборка
        env:
          FULL: ${{ inputs.full }}
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          echo "Файлы в корне репо:"; ls -la
          Z=$(ls -1 *.zip 2>/dev/null | head -1 || true)
          if [ -n "$Z" ]; then
            echo "беру архив: $Z"
            mkdir src && unzip -q "$Z" -d src
            bash src/scripts/ci.sh
          elif [ -f scripts/ci.sh ]; then
            echo "zip не найден, но проект лежит в корне, собираю из него"
            bash scripts/ci.sh
          else
            echo "::error::в корне репо нет ни .zip, ни папки scripts/. Загрузи pyengine.zip в корень репозитория"
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: pyengine-mtp
          path: |
            src/out/margyt.pyengine.mtp
            out/margyt.pyengine.mtp
